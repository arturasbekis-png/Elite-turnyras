<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELITE – Paplūdimio tinklinio turnyras</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%, rgba(0,210,255,.42), transparent 32%),
    radial-gradient(circle at 85% 20%, rgba(255,0,153,.38), transparent 30%),
    radial-gradient(circle at 50% 90%, rgba(255,193,7,.35), transparent 35%),
    linear-gradient(135deg,#071d3b 0%,#173b72 42%,#5d176f 72%,#071d3b 100%);
  color:#10233f;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.08),
    transparent 35%,
    rgba(255,255,255,.06)
  );
}

.overlay{
  min-height:100vh;
  padding:28px 16px 40px
}

.page{
  max-width:620px;
  margin:0 auto
}

.header{
  text-align:center;
  margin-bottom:18px;
  color:#fff
}

.logo{
  font-size:42px;
  font-weight:1000;
  letter-spacing:8px;
  text-shadow:0 4px 20px rgba(0,0,0,.3)
}

.title{
  font-size:29px;
  font-weight:900;
  margin:8px 0 4px
}

.subtitle{
  font-size:17px;
  font-weight:600
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:20px;
  padding:24px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.8)
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:22px
}

.info div{
  background:linear-gradient(135deg,#eef5ff,#f7eefb);
  border-radius:12px;
  padding:13px 8px;
  text-align:center
}

.info strong{
  display:block;
  font-size:15px;
  color:#071d3b
}

.info span{
  display:block;
  font-size:14px;
  margin-top:4px
}

h2{
  margin:0 0 16px;
  font-size:23px
}

.registration-button{
  display:block;
  width:100%;
  padding:16px 20px;
  background:linear-gradient(90deg,#f5c400,#ff8a00);
  color:#071d3b;
  text-decoration:none;
  font-size:18px;
  font-weight:900;
  border-radius:11px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.registration-button:hover{
  filter:brightness(.97)
}

.note{
  text-align:center;
  font-size:12px;
  color:#596575;
  margin-top:12px
}

@media(max-width:520px){
  .overlay{
    padding:18px 10px 30px
  }

  .card{
    padding:18px
  }

  .logo{
    font-size:34px
  }

  .title{
    font-size:23px
  }

  .info{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="overlay">
<main class="page">

<header class="header">
  <div class="logo">ELITE</div>
  <div class="title">Paplūdimio tinklinio turnyras</div>
  <div class="subtitle">Registracija į turnyrą</div>
</header>

<section class="card">

  <div class="info">
    <div>
      <strong>DATA</strong>
      <span>Spalio 11 d.</span>
    </div>

    <div>
      <strong>LAIKAS</strong>
      <span>10:00–13:00</span>
    </div>
  </div>

  <h2>Registracija</h2>

  <a
    href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__iaUIAhUNlkxTTZTOVo3RVdEWktaRTFMSFhVRFBHNS4u&lang=lt"
    target="_blank"
    rel="noopener noreferrer"
    class="registration-button"
  >
    REGISTRUOTIS Į TURNYRĄ
  </a>

  <div class="note">
    Paspaudę mygtuką būsite nukreipti į registracijos formą.
  </div>

</section>

</main>
</div>

</body>
</html>
